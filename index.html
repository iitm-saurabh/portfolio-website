<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saurabh Lohakare | Portfolio</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <!-- Navigation will go here -->
            </nav>
            <button id="dark-mode-toggle">Toggle Dark Mode</button>
        </div>
    </header>

    <main>
        <section id="projects" class="projects">
            <div class="container">
                <h2 class="section-title">Projects</h2>
                <div class="project-filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="Web Development">Web Development</button>
                    <button class="filter-btn" data-filter="Electronics Projects">Electronics</button>
                    <button class="filter-btn" data-filter="AI/ML">AI/ML</button>
                </div>
                <div class="projects-grid">
                    <!-- Project cards will be dynamically inserted here -->
                </div>
            </div>
        </section>

        <!-- Modal for project details -->
        <div id="project-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <div id="modal-body">
                    <!-- Project details will be dynamically inserted here -->
                </div>
            </div>
        </div>

        <section id="skills" class="skills">
            <div class="container">
                <h2 class="section-title">Skills & Expertise</h2>
                <div class="skills-container">
                    <div class="skill-category">
                        <h3>Programming Languages</h3>
                        <div id="programming-languages" class="skills-grid">
                            <!-- Programming languages will be dynamically inserted here -->
                        </div>
                    </div>
                    <div class="skill-category">
                        <h3>Electronics Expertise</h3>
                        <ul id="electronics-expertise" class="skills-list">
                            <!-- Electronics expertise will be dynamically inserted here -->
                        </ul>
                    </div>
                    <div class="skill-category">
                        <h3>Certifications</h3>
                        <ul id="certifications" class="skills-list">
                            <!-- Certifications will be dynamically inserted here -->
                        </ul>
                    </div>
                </div>
            </div>
        </section>

        <section id="experience" class="experience">
            <div class="container">
                <h2 class="section-title">Experience & Achievements</h2>
                <div id="timeline" class="timeline">
                    <!-- Timeline items will be dynamically inserted here -->
                </div>
            </div>
        </section>

        <section id="contact" class="contact">
            <div class="container">
                <h2 class="section-title">Contact Me</h2>
                <form id="contact-form" class="contact-form">
                    <input type="text" name="name" placeholder="Your Name" required>
                    <input type="email" name="email" placeholder="Your Email" required>
                    <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
                    <button type="submit" class="btn">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <!-- Footer content will go here -->
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
